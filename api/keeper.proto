syntax = "proto3";


import "google/protobuf/empty.proto";

package api;

option go_package = "github.com/konkovaanna23/gophkeeper/pkg/keeperservice";

message RegisterRequest {
  string login = 1;
  string password = 2;
}

message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
}

service AuthService {
  rpc Register(RegisterRequest) returns (google.protobuf.Empty);
  rpc Login(LoginRequest) returns (LoginResponse);
}

message AuthInfo {
  string site=1;
  string login = 2;
  string password = 3;
  map<string, string> meta = 4;
}

message AuthInfoList {
  repeated AuthInfo list=1;
}

message TextInfo {
  string title=1;
  string text=2;
  map<string, string> meta = 3;
}

message TextInfoList {
  repeated TextInfo list=1;
}

message FileChunkInfo {
  string fileName=1;
  bytes data=2;
  map<string, string> meta = 3;
}

message BankCardDetails {
  string number=1;
  uint32 expMonth=2;
  uint32 expYear=3;
  string owner=4;
  map<string, string> meta = 6;
}

message BankCardDetailsList{
  repeated BankCardDetails list=1;
}

message RequestSite {
  string site=1;
}

message RequestTitle {
  string title=1;
}

message RequestFileName {
  string fileName=1;
}

message RequestCardNumber {
  uint32 last4=1;
}


service StorageService {
  rpc SetAuthInfo(AuthInfo) returns (google.protobuf.Empty);
  rpc SetTextInfo(TextInfo) returns (google.protobuf.Empty); 
  rpc SetFileChunkInfo(stream FileChunkInfo) returns (google.protobuf.Empty); 
  rpc SetBankCardDetails(BankCardDetails) returns (google.protobuf.Empty);
  rpc GetAuthInfo(RequestSite) returns (AuthInfoList);
  rpc GetTextInfo(RequestTitle) returns (TextInfoList);
  rpc GetFileChunkInfo(RequestFileName) returns (stream FileChunkInfo);
  rpc GetBankCardDetails(RequestCardNumber) returns (BankCardDetailsList);
}