      - description: Файл
        in: formData
        name: file
        required: true
        type: file
      - description: Метаданные (JSON)
        format: json
        in: formData
        name: meta
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_konkovaanna23_gophkeeper_pkg_keeperservice.CommitUploadResponse'
