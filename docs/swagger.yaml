      security:
      - ApiKeyAuth: []
      summary: Загрузить файл
      tags:
      - files
    put:
      consumes:
      - multipart/form-data
      description: Обновляет существующий файл с контролем версий
      parameters:
      - description: Новый файл
        in: formData
        name: file
        required: true
        type: file
      - description: ID файла
        in: query
        name: id
        required: true
        type: string
      - description: Текущая версия
        in: query
        name: version
        required: true
        type: integer
      - description: Метаданные
        format: json
        in: formData
        name: meta
