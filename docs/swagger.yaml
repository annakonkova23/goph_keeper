        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Сохранить учётные данные
      tags:
      - credentials
    put:
      consumes:
      - application/json
      description: Обновляет запись с проверкой версии
      parameters:
      - description: ID, data, version
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/github_com_konkovaanna23_gophkeeper_pkg_keeperservice.UpdateAuthInfoRequest'
      produces:
