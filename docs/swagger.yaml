          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Получить учётные данные
      tags:
      - credentials
    post:
      consumes:
      - application/json
      description: Сохраняет логин и пароль
      parameters:
      - description: 'Данные: login, password, meta'
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/github_com_konkovaanna23_gophkeeper_pkg_keeperservice.AuthInfo'
      produces:
      - application/json
      responses:
        "200":
          description: OK
