syntax = "proto3";


import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

package api;

option go_package = "github.com/konkovaanna23/gophkeeper/pkg/keeperservice";

message RegisterRequest {
  string login = 1;
  string password = 2;
}

message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
}

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
}

message AuthInfo {
  string login = 1;
  string password = 2;
  map<string, string> meta = 3;
}

message StoredAuthInfo {
  string id = 1;
  AuthInfo data = 2;
  int64 version = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message CreateAuthInfoRequest {
  AuthInfo data = 1;
}

message CreateAuthInfoResponse {
  string id = 1;
  int64 version = 2;
}

message GetAuthInfoRequest {
  string id = 1;
}

message GetAuthInfoResponse {
  StoredAuthInfo item = 1;
}

message UpdateAuthInfoRequest {
  string id = 1;
  AuthInfo data = 2;
  int64 version = 3; 
}

message UpdateAuthInfoResponse {
  int64 new_version = 1;
}

message DeleteAuthInfoRequest {
  string id = 1;
  int64 version = 2;
}

message DeleteAuthInfoResponse {}


message TextInfo {
  string title=1;
  string text=2;
  map<string, string> meta = 3;
}

message TextInfoList {
  repeated TextInfo list=1;
}

message FileChunkInfo {
  string fileName=1;
  bytes data=2;
  map<string, string> meta = 3;
}

message BankCardDetails {
  string number=1;
  uint32 expMonth=2;
  uint32 expYear=3;
  string owner=4;
  map<string, string> meta = 6;
}

message BankCardDetailsList{
  repeated BankCardDetails list=1;
}

message RequestSite {
  string site=1;
}

message RequestTitle {
  string title=1;
}

message RequestFileName {
  string fileName=1;
}

message RequestCardNumber {
  uint32 last4=1;
}


service StorageService {
  rpc CreateAuthInfo(CreateAuthInfoRequest) returns (CreateAuthInfoResponse);
  rpc GetAuthInfo(GetAuthInfoRequest) returns (GetAuthInfoResponse);
  rpc UpdateAuthInfo(UpdateAuthInfoRequest) returns (UpdateAuthInfoResponse);
  rpc DeleteAuthInfo(DeleteAuthInfoRequest) returns (DeleteAuthInfoResponse);
  rpc SetTextInfo(TextInfo) returns (google.protobuf.Empty); 
  rpc SetFileChunkInfo(stream FileChunkInfo) returns (google.protobuf.Empty); 
  rpc SetBankCardDetails(BankCardDetails) returns (google.protobuf.Empty);
  rpc GetTextInfo(RequestTitle) returns (TextInfoList);
  rpc GetFileChunkInfo(RequestFileName) returns (stream FileChunkInfo);
  rpc GetBankCardDetails(RequestCardNumber) returns (BankCardDetailsList);
}